version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/db/custom.db
    volumes:
      - game-data:/app/db

  websocket:
    build: 
      context: ./mini-services/game-ws
      dockerfile: Dockerfile
    ports:
      - "3003:3003"

volumes:
  game-data:
